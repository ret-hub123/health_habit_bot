
<!-- Flash-сообщения -->

<div class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 9999; width: 100%; max-width: 400px;">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="toast align-items-center text-white border-0 show"
                     role="alert"
                     aria-live="assertive"
                     aria-atomic="true"
                     data-bs-autohide="true"
                     data-bs-delay="4000"
                     style="background-color: {% if category == 'success' %}#198754{% elif category == 'danger' %}#dc3545{% elif category == 'warning' %}#ffc107{% else %}#0d6efd{% endif %}; border-radius: 12px; margin-bottom: 10px;">
                    <div class="d-flex">
                        <div class="toast-body">
                            <i class="fas fa-{% if category == 'success' %}check-circle{% elif category == 'danger' %}exclamation-circle{% elif category == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %} me-2"></i>
                            {{ message }}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>
